<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Road To Top 15</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#1565c0;
    color:white;
    text-align:center;
    padding:15px;
}

.controls{
    text-align:center;
    padding:10px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.active{
    background:#1565c0;
    color:white;
}

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
}

.stat{
    flex:1;
    min-width:180px;
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.big{
    font-size:32px;
    font-weight:bold;
    color:#1565c0;
}

.panel{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:10px;
}

.card{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
}

.card:hover{
    background:#f0f6ff;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    overflow:auto;
}

.modal-content{
    background:white;
    width:min(1000px,95%);
    margin:20px auto;
    padding:20px;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#eee;
}

</style>
</head>

<body>

<header>
<h1>Road To Top 15</h1>
</header>

<div class="controls">

<button id="gsBtn" class="active">GS</button>
<button id="slBtn">SL</button>

<button id="mBtn" class="active">Hommes</button>
<button id="wBtn">Femmes</button>

</div>

<div class="stats">

<div class="stat">
<div id="nbAthletes" class="big">0</div>
Athlètes
</div>

<div class="stat">
<div id="avgYears" class="big">0</div>
Saisons moyennes
</div>

<div class="stat">
<div id="bestRank" class="big">0</div>
Meilleur rang
</div>

</div>

<div class="panel">
<h3>Histogramme</h3>
<canvas id="histogram"></canvas>
</div>

<div id="cards"></div>

<div class="modal" id="modal">

<div class="modal-content">

<button onclick="closeModal()">Fermer</button>

<h2 id="athleteTitle"></h2>

<canvas id="careerChart"></canvas>

<br>

<div id="careerTable"></div>

</div>

</div>

<script>

let discipline="GS";
let gender="M";

let athletes=[];
let histogramChart=null;
let careerChart=null;

function getFile(){
    return `Data/${discipline}_${gender}.csv`;
}

function loadCSV(){

    Papa.parse(getFile(),{

        download:true,
        header:true,
        skipEmptyLines:true,
        dynamicTyping:true,

        complete:function(results){

            athletes = results.data.filter(
                r => r.Name
            );

            updateStats();
            updateHistogram();
            updateCards();
        }

    });

}

function updateStats(){

    document.getElementById("nbAthletes").innerText =
        athletes.length;

    const years = athletes
        .map(a => Number(a.SeasonsToTopRank))
        .filter(v => !isNaN(v));

    const avg =
        years.length
        ? years.reduce((a,b)=>a+b,0)/years.length
        : 0;

    document.getElementById("avgYears").innerText =
        avg.toFixed(1);

    const ranks = athletes
        .map(a => Number(a.BestRankCareer))
        .filter(v => !isNaN(v));

    document.getElementById("bestRank").innerText =
        ranks.length
        ? Math.min(...ranks)
        : 0;

}

function updateHistogram(){

    const freq={};

    athletes.forEach(a=>{

        const y=a.SeasonsToTopRank;

        if(!y) return;

        freq[y]=(freq[y]||0)+1;

    });

    const labels=Object.keys(freq);
    const values=labels.map(l=>freq[l]);

    if(histogramChart){
        histogramChart.destroy();
    }

    histogramChart=new Chart(
        document.getElementById("histogram"),
        {
            type:"bar",
            data:{
                labels:labels,
                datasets:[{
                    label:"Athlètes",
                    data:values
                }]
            }
        }
    );

}

function updateCards(){

    const div=document.getElementById("cards");

    div.innerHTML="";

    athletes.forEach(a=>{

        const card=document.createElement("div");

        card.className="card";

        card.innerHTML=`
            <b>${a.Name}</b><br>
            ${a.Nation}<br>
            Top 15 en ${a.SeasonsToTopRank} saisons
        `;

        card.onclick=()=>{
            showAthlete(a);
        };

        div.appendChild(card);

    });

}

function showAthlete(a){

    document.getElementById("modal").style.display="block";

    document.getElementById("athleteTitle").innerText=
        a.Name;

    const rankCols=
        Object.keys(a)
        .filter(k=>k.startsWith("Rank"))
        .sort();

    const labels=[];
    const values=[];

    rankCols.forEach(c=>{

        const v=a[c];

        if(v && !isNaN(v)){

            labels.push(c.replace("Rank",""));
            values.push(v);

        }

    });

    if(careerChart){
        careerChart.destroy();
    }

    careerChart=new Chart(
        document.getElementById("careerChart"),
        {
            type:"line",
            data:{
                labels:labels,
                datasets:[{
                    label:"Rang",
                    data:values
                }]
            },
            options:{
                scales:{
                    y:{
                        reverse:true,
                        type:"logarithmic"
                    }
                }
            }
        }
    );

    let html="<table>";
    html+="<tr><th>Saison</th><th>Rang</th></tr>";

    rankCols.forEach(c=>{

        if(a[c]){

            html+=`
            <tr>
            <td>${c.replace("Rank","")}</td>
            <td>${a[c]}</td>
            </tr>
            `;

        }

    });

    html+="</table>";

    document.getElementById("careerTable").innerHTML=
        html;

}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

function refreshButtons(){

    document.getElementById("gsBtn").classList.toggle("active",discipline==="GS");
    document.getElementById("slBtn").classList.toggle("active",discipline==="SL");

    document.getElementById("mBtn").classList.toggle("active",gender==="M");
    document.getElementById("wBtn").classList.toggle("active",gender==="W");

}

document.getElementById("gsBtn").onclick=()=>{
    discipline="GS";
    refreshButtons();
    loadCSV();
};

document.getElementById("slBtn").onclick=()=>{
    discipline="SL";
    refreshButtons();
    loadCSV();
};

document.getElementById("mBtn").onclick=()=>{
    gender="M";
    refreshButtons();
    loadCSV();
};

document.getElementById("wBtn").onclick=()=>{
    gender="W";
    refreshButtons();
    loadCSV();
};

loadCSV();

</script>

</body>
</html>
