function currentData(){
 return datasets['GS_'+document.getElementById('gender').value];
}

function refresh(){
 let data=currentData();

 let nation=document.getElementById('nation');
 let old=nation.value||'ALL';
 nation.innerHTML='<option value="ALL">Toutes</option>';
 [...new Set(data.map(x=>x.Nation))].sort().forEach(n=>{
  let o=document.createElement('option');
  o.value=n;o.text=n;nation.add(o);
 });
 if([...nation.options].some(o=>o.value===old)) nation.value=old;

 let txt=document.getElementById('search').value.toLowerCase();
 let nat=nation.value;

 let rows=data.filter(r=>
 (nat==='ALL'||r.Nation===nat) &&
 (!txt || r.Name.toLowerCase().includes(txt))
 );

 let vals=rows.map(r=>r.SeasonsToTopRank);

 document.getElementById('stats').innerHTML=
 'Athlètes : '+rows.length+
 ' | Moyenne : '+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+
 ' | Min : '+Math.min(...vals)+
 ' | Max : '+Math.max(...vals);

 Plotly.newPlot('hist',[{x:vals,type:'histogram'}],
 {title:'Distribution des saisons nécessaires'});

 rows.sort((a,b)=>a.SeasonsToTopRank-b.SeasonsToTopRank);

 let h='<table><tr><th>Nom</th><th>Nation</th><th>Saisons</th><th>Best Rank</th></tr>';
 rows.forEach((r,i)=>{
  h+=`<tr onclick="showAthlete(${i})"><td>${r.Name}</td><td>${r.Nation}</td><td>${r.SeasonsToTopRank}</td><td>${r.BestRankCareer}</td></tr>`;
 });
 h+='</table>';
 document.getElementById('table').innerHTML=h;
 window.rows=rows;
}

function showAthlete(i){
 let r=window.rows[i];
 document.getElementById('athlete').innerHTML='<div class="card"><b>'+r.Name+'</b> ('+r.Nation+')</div>';

 let years=[],ranks=[];
 for(let y=2000;y<=2026;y++){
  let v=r['Rank'+y];
  if(v!==null && v!=='' && !isNaN(v)){years.push(y);ranks.push(v);}
 }

 Plotly.newPlot('career',[{x:years,y:ranks,mode:'lines+markers'}],{
 title:r.Name,
 yaxis:{type:'log',autorange:'reversed',tickvals:[1,2,5,10,20,50,100,200,500,1000,2000,5000]}
 });
}

document.getElementById('gender').onchange=refresh;
document.getElementById('search').oninput=refresh;
document.getElementById('nation').onchange=refresh;

refresh();
</script></body></html>
