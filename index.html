<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Road To Top 15 - DataFIS</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f3f5f7;
}

header{
    background:#1565c0;
    color:white;
    text-align:center;
    padding:15px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:12px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
    font-weight:600;
}

.active{
    background:#1565c0;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
    padding:12px;
}

.stat{
    background:white;
    border-radius:12px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-value{
    font-size:2rem;
    color:#1565c0;
    font-weight:bold;
}

.panel{
    background:white;
    margin:12px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card{
    background:white;
    margin:10px 12px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    cursor:pointer;
}

.card:hover{
    transform:translateY(-2px);
}

.name{
    font-size:1.1rem;
    font-weight:bold;
}

.rank{
    color:#1565c0;
    font-weight:bold;
    margin-top:5px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    overflow:auto;
    z-index:999;
}

.modal-content{
    background:white;
    margin:20px auto;
    width:min(1000px,95%);
    padding:20px;
    border-radius:12px;
}

.close{
    float:right;
    padding:8px 15px;
    border:none;
    background:red;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#f0f0f0;
}

@media(max-width:768px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .modal-content{
        width:98%;
    }

}

</style>
</head>
<body>

<header>
    <h1>Road To Top 15</h1>
</header>

<div class="controls">
    <button id="gsBtn" class="active">GS</button>
    <button id="slBtn">SL</button>
    <button id="mBtn" class="active">Hommes</button>
    <button id="wBtn">Femmes</button>
</div>

<div class="stats">

    <div class="stat">
        <div id="nbAthletes" class="stat-value">0</div>
        <div>Athlètes</div>
    </div>

    <div class="stat">
        <div id="avgYears" class="stat-value">0</div>
        <div>Saisons moyennes</div>
    </div>

    <div class="stat">
        <div id="fastest" class="stat-value">0</div>
        <div>Plus rapide</div>
    </div>

    <div class="stat">
        <div id="bestRank" class="stat-value">0</div>
        <div>Meilleur rang carrière</div>
    </div>

</div>

<div class="panel">
    <h3>Histogramme des saisons nécessaires</h3>
    <canvas id="histogram"></canvas>
</div>

<div id="cards"></div>

<div class="modal" id="modal">

    <div class="modal-content">

        <button class="close" onclick="closeModal()">Fermer</button>

        <h2 id="athleteTitle"></h2>

        <div class="panel">
            <canvas id="careerChart"></canvas>
        </div>

        <div id="careerTable"></div>

    </div>

</div>

<script>

let discipline="GS";
let gender="M";

let data=[];
let histogramChart=null;
let careerChart=null;

function csvFile(){
    return `Data/${discipline}_${gender}.csv`;
}

function loadData(){

    Papa.parse(csvFile(),{

        download:true,
        header:true,
        dynamicTyping:true,

        complete:function(results){

            data=results.data.filter(r=>r.Name);

            buildStats();
            buildHistogram();
            buildCards();

        }

    });

}

function buildStats(){

    document.getElementById("nbAthletes").textContent=data.length;

    const years=data
        .map(r=>Number(r.SeasonsToTopRank))
        .filter(v=>!isNaN(v));

    const avg=
        years.length
        ? years.reduce((a,b)=>a+b,0)/years.length
        : 0;

    document.getElementById("avgYears").textContent=
        avg.toFixed(1);

    document.getElementById("fastest").textContent=
        years.length ? Math.min(...years) : 0;

    const ranks=data
        .map(r=>Number(r.BestRankCareer))
        .filter(v=>!isNaN(v));

    document.getElementById("bestRank").textContent=
        ranks.length ? Math.min(...ranks) : 0;

}

function buildHistogram(){

    const values=data
        .map(r=>Number(r.SeasonsToTopRank))
        .filter(v=>!isNaN(v));

    const counts={};

    values.forEach(v=>{
        counts[v]=(counts[v]||0)+1;
    });

    const labels=Object.keys(counts)
        .sort((a,b)=>a-b);

    const series=labels.map(l=>counts[l]);

    if(histogramChart){
        histogramChart.destroy();
    }

    histogramChart=new Chart(
        document.getElementById("histogram"),
        {
            type:"bar",
            data:{
                labels:labels,
                datasets:[{
                    label:"Athlètes",
                    data:series
                }]
            },
            options:{
                responsive:true
            }
        }
    );

}

function buildCards(){

    const container=
        document.getElementById("cards");

    container.innerHTML="";

    data
    .sort((a,b)=>a.SeasonsToTopRank-b.SeasonsToTopRank)
    .forEach(row=>{

        const card=document.createElement("div");

        card.className="card";

        card.innerHTML=`
            <div class="name">${row.Name}</div>
            <div>${row.Nation}</div>
            <div class="rank">
                ${row.SeasonsToTopRank} saisons vers Top 15
            </div>
            <div>
                Meilleur rang : ${row.BestRankCareer}
            </div>
        `;

        card.onclick=()=>showAthlete(row);

        container.appendChild(card);

    });

}

function showAthlete(row){

    document.getElementById("modal").style.display="block";

    document.getElementById("athleteTitle").innerHTML=
        `${row.Name} (${row.Nation})`;

    buildCareerChart(row);
    buildCareerTable(row);

}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

function buildCareerChart(row){

    const rankCols=
        Object.keys(row)
        .filter(k=>k.startsWith("Rank"))
        .sort((a,b)=>
            Number(a.replace("Rank",""))
            -
            Number(b.replace("Rank",""))
        );

    const labels=[];
    const values=[];

    rankCols.forEach(c=>{

        const v=row[c];

        if(v && !isNaN(v)){

            labels.push(c.replace("Rank",""));
            values.push(v);

        }

    });

    if(careerChart){
        careerChart.destroy();
    }

    careerChart=new Chart(
        document.getElementById("careerChart"),
        {
            type:"line",
            data:{
                labels:labels,
                datasets:[{
                    label:"Rang mondial",
                    data:values,
                    tension:0.3
                }]
            },
            options:{
                responsive:true,
                scales:{
                    y:{
                        reverse:true,
                        type:"logarithmic"
                    }
                }
            }
        }
    );

}

function buildCareerTable(row){

    const rankCols=
        Object.keys(row)
        .filter(k=>k.startsWith("Rank"))
        .sort((a,b)=>
            Number(b.replace("Rank",""))
            -
            Number(a.replace("Rank",""))
        );

    let html=`
    <table>
    <tr>
        <th>Saison</th>
        <th>Rang</th>
    </tr>
    `;

    rankCols.forEach(c=>{

        if(row[c]){

            html+=`
            <tr>
                <td>${c.replace("Rank","")}</td>
                <td>${row[c]}</td>
            </tr>
            `;

        }

    });

    html+="</table>";

    document.getElementById("careerTable").innerHTML=
        html;

}

function updateButtons(){

    gsBtn.classList.toggle("active",discipline==="GS");
    slBtn.classList.toggle("active",discipline==="SL");

    mBtn.classList.toggle("active",gender==="M");
    wBtn.classList.toggle("active",gender==="W");

}

gsBtn.onclick=()=>{
    discipline="GS";
    updateButtons();
    loadData();
};

slBtn.onclick=()=>{
    discipline="SL";
    updateButtons();
    loadData();
};

mBtn.onclick=()=>{
    gender="M";
    updateButtons();
    loadData();
};

wBtn.onclick=()=>{
    gender="W";
    updateButtons();
    loadData();
};

loadData();

</script>

</body>
</html>
