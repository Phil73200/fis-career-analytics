<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road to Top 15 — Étude sur 15 saisons (2012–2026)</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--sl:#e3f2fd;--gs:#fce4ec;--sg:#e8f5e9;--dh:#fffde7;--male:#1565c0;--female:#c2185b}
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
header{background:#1565c0;color:#fff;padding:12px;text-align:center}
.controls,.filters{display:flex;flex-wrap:wrap;gap:8px;padding:10px;justify-content:center}
button,select,input{padding:8px;border-radius:8px;border:1px solid #ccc;font-weight:600}
#analysis{width:175px;max-width:100%}
#SL{background:var(--sl)} #GS{background:var(--gs)} #SG{background:var(--sg)} #DH{background:var(--dh)}
#M{background:var(--male);color:#fff} #W{background:var(--female);color:#fff}
.active{border:3px solid #000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:10px}
.stat,.panel{background:#fff;border-radius:10px;padding:12px}
.big{font-size:28px;font-weight:bold}
.cards{padding:10px}
.card{margin-bottom:8px;cursor:pointer;border-radius:10px;padding:12px;border:2px solid #000}
.sl{background:var(--sl)} .gs{background:var(--gs)} .sg{background:var(--sg)} .dh{background:var(--dh)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);overflow:auto;z-index:9999}
.modal-content{background:#fff;width:min(1000px,95%);margin:20px auto;padding:20px;border-radius:10px}
.hist-tooltip[hidden]{display:none}
.hist-tooltip{position:relative;margin:12px 10px;width:auto;max-height:45vh;overflow:auto;padding:16px;background:#fff;color:#172b42;border:2px solid #1565c0;border-radius:10px;font-size:14px;line-height:1.45}
#closeHistTooltip{float:right;margin-left:10px;cursor:pointer}
.hist-tooltip .athlete-tooltip-link{padding:0;border:0;background:transparent;text-align:left;font:inherit;color:#003f78;text-decoration:underline;cursor:pointer}
.athlete-tooltip-link:focus-visible{outline:2px solid #1565c0;outline-offset:3px}
.hist-tooltip ul{padding-left:20px;margin:12px 0 0}
.hist-tooltip li{margin-bottom:7px}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Road to Top 15 — Étude sur 15 saisons (2012–2026)</h1></header>

<div class="controls">
<button id="SL">SL</button><button id="GS">GS</button><button id="SG">SG</button><button id="DH">DH</button>
<button id="M">Hommes</button><button id="W">Femmes</button>
</div>

<div class="filters">
<select id="nation"><option value="">Toutes nations</option></select>
<select id="analysis" aria-label="Choisir le Top pour calculer la durée">
<option value="" disabled selected>Durée pour Top X</option>
<option value="15">Top 15</option>
<option value="10">Top 10</option>
<option value="5">Top 5</option>
<option value="3">Top 3</option>
<option value="1">N°1</option>
</select>
<input id="search" placeholder="Recherche athlète">
</div>

<div class="stats">
<div class="stat"><div class="big" id="s1">0</div>Athlètes</div>
<div class="stat"><div class="big" id="s2">0</div>Moyenne saisons</div>
<div class="stat"><div class="big" id="s3">0</div>Plus rapide</div>
<div class="stat"><div class="big" id="s4">0</div>N°1 mondiaux</div>
</div>

<div class="panel">
<h2 id="durationTitle">Durée pour Top X</h2>
<p id="chartExplanation">Nombre de coureurs par durée d’accès au Top 15.</p>
<p>Touchez une barre pour voir les noms.</p>



<canvas id="hist"></canvas>
</div>
<aside id="histTooltip" class="hist-tooltip" hidden aria-live="polite">
<button type="button" id="closeHistTooltip" aria-label="Fermer l’infobulle">×</button>
<strong id="histTooltipTitle"></strong><ul id="histTooltipNames"></ul>
</aside>


<div id="modal" class="modal">
<div class="modal-content">
<button onclick="closeModal()">Fermer</button>
<h2 id="athleteTitle"></h2>
<div id="careerInfo"></div>
<div class="panel"><canvas id="careerChart"></canvas></div>
</div>
</div>

<script>
let discipline='SL',gender='M',rows=[],careerChart=null;
const analysis=document.getElementById('analysis');
let topSelection=15;
function selectedTop(){return topSelection;}
analysis.value='';
analysis.onchange=()=>{topSelection=+analysis.value;render();};
function color(){return {SL:'#90caf9',GS:'#f8bbd0',SG:'#c8e6c9',DH:'#fff9c4'}[discipline]}
function file(){return `Data/${discipline}_${gender}.csv`}

function updateButtons(){
['SL','GS','SG','DH'].forEach(x=>document.getElementById(x).classList.remove('active'));
['M','W'].forEach(x=>document.getElementById(x).classList.remove('active'));
document.getElementById(discipline).classList.add('active');
document.getElementById(gender).classList.add('active');
}

function load(){
Papa.parse(file(),{
download:true,header:true,skipEmptyLines:true,dynamicTyping:true,
complete:r=>{rows=r.data.filter(x=>x.Name);render();},
error:e=>alert('CSV introuvable : '+file())
});
}

function durationForTop(a,top){
 const first=Number(a.FirstSeason),top15=Number(a.FirstTopSeason);
 if(!first||!top15||top15<first)return {duration:null,reason:'Début de carrière incomplet'};
 if(top===15)return {duration:top15-first+1,reached:top15};
 const seasons=Object.keys(a).filter(k=>/^Rank\d{4}$/.test(k)).map(k=>+k.slice(4)).sort((x,y)=>x-y);
 const reached=seasons.find(year=>year>=top15 && +a['Rank'+year]>0 && +a['Rank'+year]<=top);
 if(!reached)return {duration:null,reason:'Première entrée non retrouvée dans les classements disponibles'};
 // A Top X cannot precede the known first Top 15. Every season between
 // that lower bound and the observed hit must be known to prove a first hit.
 for(let year=top15;year<reached;year++){
  if(!(+a['Rank'+year]>0))return {duration:null,reached,reason:'Saisons antérieures manquantes : première entrée non vérifiable'};
 }
 return {duration:reached-first+1,reached};
}

function showAthlete(a){
const top=selectedTop(),result=durationForTop(a,top);
document.getElementById("modal").style.display="block";
document.getElementById("athleteTitle").innerHTML=`${a.Name} (${a.Nation})`;
document.getElementById("careerInfo").innerHTML=`
<p><b>Naissance :</b> ${a.BirthYear}</p>
<p><b>Meilleur rang :</b> ${a.BestRankCareer}</p>
<p><b>Première saison :</b> ${a.FirstSeason}</p>
<p><b>Top atteint :</b> ${result.reached||'Non retrouvée'}</p>
<p><b>Durée pour Top ${top} :</b> ${result.duration!==null?result.duration+' saisons':result.reason}</p>`;

const cols=Object.keys(a).filter(k=>k.startsWith('Rank')).sort();
const labels=[],vals=[];
cols.forEach(c=>{const v=Number(a[c]); if(Number.isFinite(v)&&v>0){labels.push(c.replace('Rank','')); vals.push(v);}});
if(careerChart) careerChart.destroy();
careerChart=new Chart(document.getElementById('careerChart'),{
type:'line',
data:{labels:labels,datasets:[{data:vals,borderColor:color(),backgroundColor:color()}]},
options:{scales:{y:{reverse:true,type:'logarithmic'}}}
});
}
function closeModal(){document.getElementById("modal").style.display="none";}

function hideHistogramTooltip(){document.getElementById('histTooltip').hidden=true;}
function showHistogramTooltip(seasons,athletes){
 const box=document.getElementById('histTooltip');
 document.getElementById('histTooltipTitle').textContent=`${seasons} saisons · ${athletes.length} coureur${athletes.length>1?'s':''}`;
 const list=document.getElementById('histTooltipNames');list.replaceChildren();
 athletes.forEach(a=>{
  const li=document.createElement('li');
  const button=document.createElement('button');
  button.className='athlete-tooltip-link';
  button.textContent=`${a.Name} (${a.Nation}) — ${a.duration} saisons, ${a.FirstSeason}–${a.reached}`;
  button.onclick=()=>{hideHistogramTooltip();showAthlete(a);};
  li.appendChild(button);
  list.appendChild(li);
 });
 box.hidden=false;
}
document.getElementById('closeHistTooltip').onclick=hideHistogramTooltip;
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideHistogramTooltip();});

function render(){
let d=[...rows];
const n=nation.value,o=selectedTop(),q=search.value.toLowerCase();
if(n)d=d.filter(x=>x.Nation===n);
if(o<999)d=d.filter(x=>(+x.BestRankCareer||999)<=o);
if(q)d=d.filter(x=>x.Name.toLowerCase().includes(q));
d=d.map(a=>({...a,...durationForTop(a,o)})).filter(a=>a.duration!==null);
const topLabel=o===1?'n°1':`Top ${o}`;
durationTitle.textContent=`Durée pour ${topLabel}`;
document.getElementById('chartExplanation').textContent=`Nombre de coureurs par durée d’accès au ${topLabel}.`;

const s='time';
if(s==='time')d.sort((a,b)=>a.duration-b.duration);
if(s==='rank')d.sort((a,b)=>a.BestRankCareer-b.BestRankCareer);
if(s==='name')d.sort((a,b)=>a.Name.localeCompare(b.Name));
if(s==='birth')d.sort((a,b)=>a.BirthYear-b.BirthYear);

s1.textContent=d.length;
const yrs=d.map(x=>x.duration).filter(x=>x>0);
s2.textContent=yrs.length?(yrs.reduce((a,b)=>a+b,0)/yrs.length).toFixed(1):0;
s3.textContent=yrs.length?Math.min(...yrs):0;
s4.textContent=d.filter(x=>+x.BestRankCareer===1).length;

if(nation.options.length===1){
[...new Set(rows.map(x=>x.Nation).filter(Boolean).sort())].forEach(v=>{
let o=document.createElement('option');o.value=v;o.textContent=v;nation.appendChild(o);
});
}

const freq={}; yrs.forEach(v=>freq[v]=(freq[v]||0)+1);
if(window.h)window.h.destroy();
hideHistogramTooltip();
window.h=new Chart(hist,{
 type:'bar',
 data:{labels:Object.keys(freq),datasets:[{label:'Nombre de coureurs',data:Object.values(freq),backgroundColor:color(),borderColor:'#000',borderWidth:1.5}]},
 options:{
  scales:{x:{title:{display:true,text:`Saisons pour atteindre le ${topLabel}`,font:{size:18,weight:'bold'},color:'#172b42'}},y:{beginAtZero:true,ticks:{precision:0},title:{display:true,text:'Nombre de coureurs'}}},
  plugins:{legend:{display:false},tooltip:{enabled:false,external:({tooltip})=>{
   if(!tooltip.opacity || !tooltip.dataPoints?.length)return;
   const seasons=+tooltip.dataPoints[0].label;
   showHistogramTooltip(seasons,d.filter(a=>a.duration===seasons));
  }}}
 }
});


}

['SL','GS','SG','DH'].forEach(x=>document.getElementById(x).onclick=()=>{discipline=x;updateButtons();load();});
['M','W'].forEach(x=>document.getElementById(x).onclick=()=>{gender=x;updateButtons();load();});
['nation','search'].forEach(x=>document.getElementById(x).oninput=render);

updateButtons();
load();
</script>
</body>
</html>
