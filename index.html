<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Road To Top 15 - DataFIS</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --blue:#1565c0;
    --blue2:#1976d2;
    --light:#f4f7fb;
    --card:#ffffff;
    --shadow:0 2px 10px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--light);
    color:#222;
}

header{
    background:var(--blue);
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:1.6rem;
}

.controls{
    background:white;
    padding:15px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    box-shadow:var(--shadow);
}

button{
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
    font-weight:600;
}

.filter-btn{
    background:#e0e0e0;
}

.filter-btn.active{
    background:var(--blue);
    color:white;
}

.stats{
    padding:15px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.stat-card{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:var(--shadow);
    text-align:center;
}

.stat-value{
    font-size:1.8rem;
    font-weight:bold;
    color:var(--blue);
}

.section{
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:var(--shadow);
    margin-bottom:12px;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
}

.card-name{
    font-size:1.1rem;
    font-weight:700;
}

.card-info{
    margin-top:5px;
    color:#666;
    font-size:.95rem;
}

.card-rank{
    margin-top:8px;
    font-size:1.1rem;
    color:var(--blue);
    font-weight:bold;
}

.chart-container{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

canvas{
    max-width:100%;
}

#athleteModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:999;
    overflow:auto;
}

.modal-content{
    background:white;
    margin:20px auto;
    width:min(1000px,95%);
    border-radius:12px;
    padding:20px;
}

.close-btn{
    float:right;
    background:red;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#f0f0f0;
}

@media(max-width:768px){

    header h1{
        font-size:1.2rem;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .modal-content{
        width:98%;
        padding:12px;
    }

    table{
        font-size:.8rem;
    }

}

</style>
</head>
<body>

<header>
    <h1>Road To Top 15</h1>
</header>

<div class="controls">

    <button class="filter-btn active" id="btnGS">GS</button>
    <button class="filter-btn" id="btnSL">SL</button>

    <button class="filter-btn active" id="btnM">Hommes</button>
    <button class="filter-btn" id="btnW">Femmes</button>

</div>

<div class="stats">

    <div class="stat-card">
        <div class="stat-value" id="totalAthletes">0</div>
        <div>Athlètes</div>
    </div>

    <div class="stat-card">
        <div class="stat-value" id="avgYears">0</div>
        <div>Saisons moyennes</div>
    </div>

    <div class="stat-card">
        <div class="stat-value" id="fastest">0</div>
        <div>Progression la plus rapide</div>
    </div>

    <div class="stat-card">
        <div class="stat-value" id="oldestSeason">0</div>
        <div>Première saison</div>
    </div>

</div>

<div class="section">

    <div class="chart-container">
        <h3>Histogramme : saisons nécessaires pour atteindre le Top 15</h3>
        <canvas id="histogramChart"></canvas>
    </div>

    <div id="athletesContainer"></div>

</div>

<div id="athleteModal">

    <div class="modal-content">

        <button class="close-btn" onclick="closeModal()">Fermer</button>

        <h2 id="modalTitle"></h2>

        <br>

        <div class="chart-container">
            <canvas id="careerChart"></canvas>
        </div>

        <table id="careerTable"></table>

    </div>

</div>

<script>

let discipline = "GS";
let gender = "M";

let allData = [];
let histogramChart = null;
let careerChart = null;

function fileName(){
    return `Data/${discipline}_${gender}.csv`;
}

function loadData(){

    Papa.parse(fileName(),{

        download:true,
        header:true,
        dynamicTyping:true,

        complete:function(results){

            allData = results.data.filter(r => r.FullName);

            buildStats();
            buildHistogram();
            buildCards();

        }

    });

}

function buildStats(){

    document.getElementById("totalAthletes").textContent = allData.length;

    let years = allData.map(r => Number(r.SeasonsToTopRank)).filter(Boolean);

    let avg = years.reduce((a,b)=>a+b,0)/years.length;

    document.getElementById("avgYears").textContent =
        avg.toFixed(1);

    document.getElementById("fastest").textContent =
        Math.min(...years);

    let seasons = allData.map(r => Number(r.FirstSeason));

    document.getElementById("oldestSeason").textContent =
        Math.min(...seasons);

}

function buildHistogram(){

    const years = allData
        .map(r => Number(r.SeasonsToTopRank))
        .filter(Boolean);

    const freq = {};

    years.forEach(y=>{
        freq[y]=(freq[y]||0)+1;
    });

    const labels = Object.keys(freq).sort((a,b)=>a-b);

    const values = labels.map(l=>freq[l]);

    if(histogramChart){
        histogramChart.destroy();
    }

    histogramChart = new Chart(
        document.getElementById("histogramChart"),
        {
            type:"bar",
            data:{
                labels:labels,
                datasets:[{
                    label:"Athlètes",
                    data:values
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false
            }
        }
    );

}

function buildCards(){

    const container =
        document.getElementById("athletesContainer");

    container.innerHTML = "";

    allData
    .sort((a,b)=>
        Number(a.SeasonsToTopRank) -
        Number(b.SeasonsToTopRank)
    )
    .forEach(row=>{

        const div = document.createElement("div");

        div.className="card";

        div.innerHTML=`

            <div class="card-name">
                ${row.FullName}
            </div>

            <div class="card-info">
                ${row.Nationcode || ""}
            </div>

            <div class="card-rank">
                ${row.SeasonsToTopRank} saisons
            </div>

        `;

        div.onclick=()=>showAthlete(row);

        container.appendChild(div);

    });

}

function showAthlete(row){

    document.getElementById("athleteModal").style.display="block";

    document.getElementById("modalTitle").innerHTML=
        row.FullName;

    buildCareerChart(row);
    buildCareerTable(row);

}

function closeModal(){

    document.getElementById("athleteModal").style.display="none";

}

function buildCareerChart(row){

    const seasonColumns =
        Object.keys(row)
        .filter(k => k.startsWith("Rank"))
        .sort((a,b)=>
            Number(a.replace("Rank","")) -
            Number(b.replace("Rank",""))
        );

    const labels =
        seasonColumns.map(c=>c.replace("Rank",""));

    const values =
        seasonColumns.map(c=>Number(row[c]));

    if(careerChart){
        careerChart.destroy();
    }

    careerChart = new Chart(
        document.getElementById("careerChart"),
        {
            type:"line",
            data:{
                labels:labels,
                datasets:[{
                    label:"Rang mondial",
                    data:values,
                    tension:0.2
                }]
            },
            options:{
                responsive:true,
                scales:{
                    y:{
                        type:"logarithmic",
                        reverse:true,
                        title:{
                            display:true,
                            text:"Rang mondial"
                        }
                    }
                }
            }
        }
    );

}

function buildCareerTable(row){

    const table =
        document.getElementById("careerTable");

    const seasonColumns =
        Object.keys(row)
        .filter(k => k.startsWith("Rank"))
        .sort((a,b)=>
            Number(a.replace("Rank","")) -
            Number(b.replace("Rank",""))
        );

    let html = `
        <tr>
            <th>Saison</th>
            <th>Rang</th>
        </tr>
    `;

    seasonColumns.forEach(col=>{

        html += `
            <tr>
                <td>${col.replace("Rank","")}</td>
                <td>${row[col]}</td>
            </tr>
        `;

    });

    table.innerHTML = html;

}

document.getElementById("btnGS").onclick=()=>{
    discipline="GS";
    setButtons();
    loadData();
};

document.getElementById("btnSL").onclick=()=>{
    discipline="SL";
    setButtons();
    loadData();
};

document.getElementById("btnM").onclick=()=>{
    gender="M";
    setButtons();
    loadData();
};

document.getElementById("btnW").onclick=()=>{
    gender="W";
    setButtons();
    loadData();
};

function setButtons(){

    document.getElementById("btnGS")
        .classList.toggle("active",discipline==="GS");

    document.getElementById("btnSL")
        .classList.toggle("active",discipline==="SL");

    document.getElementById("btnM")
        .classList.toggle("active",gender==="M");

    document.getElementById("btnW")
        .classList.toggle("active",gender==="W");

}

loadData();

</script>

</body>
</html>
