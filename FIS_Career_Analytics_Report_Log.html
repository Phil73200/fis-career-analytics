const nation=document.getElementById('nation');

[...new Set(data.map(d=>d.Nation))]
.sort()
.forEach(n=>{
 const o=document.createElement('option');
 o.value=n;
 o.text=n;
 nation.add(o);
});

Plotly.newPlot('hist',[{
 x:data.map(d=>d.SeasonsToTopRank),
 type:'histogram'
}],{
 title:'Distribution du nombre de saisons nécessaires pour atteindre le Top15'
});

function rows(){
 const nat=document.getElementById('nation').value;
 const txt=document.getElementById('search').value.toLowerCase();

 return data.filter(r=>
   (nat==='ALL'||r.Nation===nat) &&
   (!txt || r.Name.toLowerCase().includes(txt))
 );
}

function refresh(){
 let r=rows().sort((a,b)=>a.SeasonsToTopRank-b.SeasonsToTopRank);

 let h='<table><tr>';
 h+='<th>Nom</th>';
 h+='<th>Nation</th>';
 h+='<th>Né</th>';
 h+='<th>1ère saison</th>';
 h+='<th>1er Top15</th>';
 h+='<th>Saisons</th>';
 h+='<th>Meilleur rang</th>';
 h+='</tr>';

 r.forEach((x,i)=>{
 h+=`<tr onclick="showAthlete(${i})">
 <td>${x.Name}</td>
 <td>${x.Nation}</td>
 <td>${x.BirthYear}</td>
 <td>${x.FirstSeason}</td>
 <td>${x.FirstTopSeason}</td>
 <td>${x.SeasonsToTopRank}</td>
 <td>${x.BestRankCareer}</td>
 </tr>`;
 });

 h+='</table>';

 document.getElementById('table').innerHTML=h;
 window.current=r;
}

function showAthlete(i){
 const r=window.current[i];

 document.getElementById('athlete').innerHTML =
 `<div class="card">
 <b>${r.Name}</b> (${r.Nation})<br>
 Né : ${r.BirthYear}<br>
 Première saison : ${r.FirstSeason}<br>
 Premier Top15 : ${r.FirstTopSeason}<br>
 Temps d'accès : ${r.SeasonsToTopRank} saisons<br>
 Meilleur rang : ${r.BestRankCareer} (saison ${r.BestRankSeason})
 </div>`;

 let years=[];
 let ranks=[];

 for(let y=2000;y<=2026;y++){

   let v=r['Rank'+y];

   if(v!==null && v!=='' && !isNaN(v)){
      years.push(y);
      ranks.push(v);
   }
 }

 const useLog=document.getElementById('logScale').checked;

 Plotly.newPlot('career',[{
   x:years,
   y:ranks,
   mode:'lines+markers',
   type:'scatter'
 }],{
   title:r.Name,
   yaxis:{
      autorange:'reversed',
      type: useLog ? 'log' : 'linear',
      tickvals:[1,2,5,10,20,50,100,200,500,1000,2000,5000],
      title:'Rang mondial'
   },
   xaxis:{
      title:'Saison'
   }
 });
}

nation.onchange=refresh;
search.oninput=refresh;

document.getElementById('logScale').onchange=function(){
 if(window.current && window.current.length>0){
   const selected=document.querySelector('#athlete b');
 }
};

refresh();
</script>
